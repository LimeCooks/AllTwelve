name: Build and integration checks

on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alltwelve-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and verify AllTwelve
    if: github.event_name != 'release' || !github.event.release.prerelease
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify the release tag
        if: github.event_name == 'release'
        shell: bash
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Use a release tag in vMAJOR.MINOR.PATCH format."
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "::error::Release tags must point to a commit on main."
            exit 1
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v6
        with:
          version: '11.25.0'
          cache: true

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm typecheck

      - name: Run regression tests
        run: pnpm test

      - name: Build the app
        run: pnpm build

      - name: Run isolated integration checks
        id: integration
        run: node scripts/check-local-pilot.mjs

      - name: Retain integration report and logs
        if: ${{ !cancelled() && (steps.integration.outcome == 'success' || steps.integration.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: integration-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            outputs/local-pilot-check-*/report.json
            outputs/local-pilot-check-*/*/setup.log
            outputs/local-pilot-check-*/*/worker.log
          retention-days: 14
          if-no-files-found: error
